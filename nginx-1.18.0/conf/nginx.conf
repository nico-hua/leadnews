#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 设置全局上传文件大小限制（例如100MB）
    client_max_body_size 100M;

    # 引入自定义配置文件
    include leadnews.conf/*.conf;
}
