spring:
  mvc:
    date-format: yyyy-MM-dd
  data:
   mongodb:
    host: 127.0.0.1
    port: 27017
    database: leadnews-comment
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/leadnews_wemedia?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false
    username: root
    password: 123456a
  servlet:
    multipart:
      max-file-size: 100MB  # 单个文件最大大小
      max-request-size: 100MB  # 总请求最大大小
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
# 设置Mapper接口所对应的XML文件位置，如果你在Mapper接口中有自定义方法，需要进行该配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  # 设置别名包扫描路径，通过该属性可以给包中的类注册别名
  type-aliases-package: com.heima.model.wemedia.pojos
minio:
  accessKey: minio
  secretKey: minio123
  bucket: leadnews
  endpoint: http://127.0.0.1:9000
  readPath: http://127.0.0.1:9000

feign:
  # 开启feign对hystrix熔断降级的支持
  hystrix:
    enabled: true
  # 修改调用超时时间
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

tess4j:
  data-path: D:\Desktop\Code\tessdata
  language: chi_sim